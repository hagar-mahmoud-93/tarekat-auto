name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  # Fired by other repos' pipelines (e.g. BE/FE) when their change touches an area we cover here,
  # so we catch regressions before they merge. client_payload.label maps to a @tag on the relevant
  # suite (@cash-division, @investment-division, @division, @nafith-login, ...) — see tests/ for
  # the full set. No label runs the full suite.
  repository_dispatch:
    types: [run-tests]
  # Daily full-suite run at 4:15pm Riyadh time (UTC+3, no DST) = 13:15 UTC.
  schedule:
    - cron: '15 13 * * *'
  # Manual trigger from the Actions tab — "Use workflow from" gives the branch picker for free;
  # this input adds a suite picker alongside it.
  workflow_dispatch:
    inputs:
      label:
        description: 'Test suite to run'
        required: true
        type: choice
        default: full
        options:
          - full
          - crm
          - division
          - nafith-login
jobs:
  # Resolves which suite(s) to run from either trigger, once, so the three suite jobs below don't
  # each repeat the same parsing/validation of an untrusted external payload.
  scope:
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.resolve.outputs.label }}
    steps:
    - id: resolve
      env:
        RAW_LABEL: ${{ github.event.client_payload.label || inputs.label }}
      run: |
        LABEL="${RAW_LABEL:-full}"
        if [[ ! "$LABEL" =~ ^[a-z0-9-]+$ ]]; then
          echo "::error::Invalid label '$LABEL' — must match ^[a-z0-9-]+$"
          exit 1
        fi
        echo "label=$LABEL" >> "$GITHUB_OUTPUT"

  # Named per domain (crm / division / nafith-login) so each shows as its own check in the PR/Actions
  # UI and runs in parallel — they only share the `scope` dependency, not each other.
  crm:
    needs: scope
    if: ${{ needs.scope.outputs.label == 'full' || needs.scope.outputs.label == 'crm' }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test --grep "@crm"
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: allure-results-crm
        path: allure-results/
        retention-days: 30

  division:
    needs: scope
    if: >-
      ${{ needs.scope.outputs.label == 'full' || needs.scope.outputs.label == 'division' ||
      needs.scope.outputs.label == 'cash-division' || needs.scope.outputs.label == 'investment-division' }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      env:
        SCOPE_LABEL: ${{ needs.scope.outputs.label }}
      run: |
        if [ "$SCOPE_LABEL" = "full" ] || [ "$SCOPE_LABEL" = "division" ]; then
          npx playwright test --grep "@division"
        else
          npx playwright test --grep "@$SCOPE_LABEL"
        fi
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: allure-results-division
        path: allure-results/
        retention-days: 30

  nafith-login:
    needs: scope
    if: ${{ needs.scope.outputs.label == 'full' || needs.scope.outputs.label == 'nafith-login' }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test --grep "@nafith-login"
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: allure-results-nafith-login
        path: allure-results/
        retention-days: 30

  # Merges the results from all three domain jobs into a single Allure report (one history,
  # one set of trend graphs) instead of three independent per-domain reports.
  publish-report:
    needs: [crm, division, nafith-login]
    # Runs even if a domain job didn't execute for this trigger's scope (skipped, not failed).
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Serializes gh-pages publishes: this job reads the current gh-pages content, merges in new
    # results, then overwrites the whole branch — two overlapping runs can race and the second to
    # start (not finish) clobbers the first's update with stale data it read before the first push.
    concurrency:
      group: publish-report-gh-pages
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@v4
    - name: Download allure results
      uses: actions/download-artifact@v4
      with:
        pattern: allure-results-*
        path: allure-results-all
        merge-multiple: true
    - name: Load report history
      uses: actions/checkout@v4
      if: always()
      continue-on-error: true
      with:
        ref: gh-pages
        path: gh-pages
    - name: Build combined report
      uses: simple-elf/allure-report-action@v1.15
      with:
        allure_results: allure-results-all
        allure_history: allure-history
        allure_report: allure-report
        gh_pages: gh-pages
    - name: Fix report ownership
      # The allure-report-action runs as root in a Docker container, so allure-history/ ends up
      # root-owned on the runner's filesystem — reclaim it before the runner user writes to it.
      if: always()
      run: |
        mkdir -p allure-history
        sudo chown -R "$(id -u):$(id -g)" allure-history
    - name: Publish report to GitHub Pages
      if: always()
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: allure-history

  # Only the unattended daily run gets a Slack ping — push/PR/dispatch runs already surface
  # their result in the Actions UI or PR checks in front of whoever triggered them.
  notify-slack:
    needs: [crm, division, nafith-login, publish-report]
    if: ${{ always() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    steps:
    - name: Send Slack notification
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        CRM_RESULT: ${{ needs.crm.result }}
        DIVISION_RESULT: ${{ needs.division.result }}
        NAFITH_RESULT: ${{ needs.nafith-login.result }}
        REPORT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        STATUS="success"
        for r in "$CRM_RESULT" "$DIVISION_RESULT" "$NAFITH_RESULT"; do
          if [ "$r" = "failure" ]; then STATUS="failure"; fi
        done
        EMOJI="✅"
        [ "$STATUS" = "failure" ] && EMOJI="❌"
        curl -sf -X POST -H 'Content-type: application/json' \
          --data "{\"text\": \"${EMOJI} Daily Tarekat E2E run — crm: ${CRM_RESULT}, division: ${DIVISION_RESULT}, nafith-login: ${NAFITH_RESULT}\n<${REPORT_URL}|View Allure report> | <${RUN_URL}|View run>\"}" \
          "$SLACK_WEBHOOK_URL"
