name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  # Fired by other repos' pipelines (e.g. BE/FE) when their change touches an area we cover here,
  # so we catch regressions before they merge. client_payload.label maps to a @tag on the relevant
  # suite (@cash-division, @investment-division, @division, @nafith-login, ...) — see tests/ for
  # the full set. No label runs the full suite.
  repository_dispatch:
    types: [run-tests]
  # Daily full-suite run at 4:18pm Riyadh time (UTC+3, no DST) = 13:18 UTC.
  schedule:
    - cron: '27 13 * * *'
  # Manual trigger from the Actions tab — "Use workflow from" gives the branch picker for free;
  # this input adds a suite picker alongside it.
  workflow_dispatch:
    inputs:
      label:
        description: 'Test suite to run'
        required: true
        type: choice
        default: full
        options:
          - full
          - crm
          - division
          - nafith-login
jobs:
  # Resolves which suite(s) to run from either trigger, once, so the three suite jobs below don't
  # each repeat the same parsing/validation of an untrusted external payload.
  scope:
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.resolve.outputs.label }}
    steps:
    - id: resolve
      env:
        RAW_LABEL: ${{ github.event.client_payload.label || inputs.label }}
      run: |
        LABEL="${RAW_LABEL:-full}"
        if [[ ! "$LABEL" =~ ^[a-z0-9-]+$ ]]; then
          echo "::error::Invalid label '$LABEL' — must match ^[a-z0-9-]+$"
          exit 1
        fi
        echo "label=$LABEL" >> "$GITHUB_OUTPUT"

  # Named per domain (crm / division / nafith-login) so each shows as its own check in the PR/Actions
  # UI and runs in parallel — they only share the `scope` dependency, not each other.
  crm:
    needs: scope
    if: ${{ needs.scope.outputs.label == 'full' || needs.scope.outputs.label == 'crm' }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.summary.outputs.passed }}
      failed: ${{ steps.summary.outputs.failed }}
      skipped: ${{ steps.summary.outputs.skipped }}
      flaky: ${{ steps.summary.outputs.flaky }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    # Browser binaries are the slow part of "install --with-deps" — cache them by
    # lockfile hash so a run only re-downloads when the Playwright version actually
    # changes. OS-level deps (apt packages) aren't cacheable this way, so on a cache
    # hit we still run install-deps for those, which is fast on the stock ubuntu-latest image.
    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
    - name: Install Playwright Browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps
    - name: Install Playwright OS dependencies
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps
    - name: Run Playwright tests
      run: npx playwright test --grep "@crm"
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: allure-results-crm
        path: allure-results/
        retention-days: 30
    # Feeds the Slack notification's pass/fail/skipped/flaky counts — read from Playwright's
    # own JSON reporter output (test-results/results.json), not Allure, since Allure results
    # get merged across domains later and lose the per-domain breakdown by then.
    - name: Extract test summary
      id: summary
      if: always()
      run: |
        if [ -f test-results/results.json ]; then
          PASSED=$(jq '.stats.expected' test-results/results.json)
          FAILED=$(jq '.stats.unexpected' test-results/results.json)
          SKIPPED=$(jq '.stats.skipped' test-results/results.json)
          FLAKY=$(jq '.stats.flaky' test-results/results.json)
        else
          PASSED=0; FAILED=0; SKIPPED=0; FLAKY=0
        fi
        {
          echo "passed=$PASSED"
          echo "failed=$FAILED"
          echo "skipped=$SKIPPED"
          echo "flaky=$FLAKY"
        } >> "$GITHUB_OUTPUT"

  division:
    needs: scope
    if: >-
      ${{ needs.scope.outputs.label == 'full' || needs.scope.outputs.label == 'division' ||
      needs.scope.outputs.label == 'cash-division' || needs.scope.outputs.label == 'investment-division' }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.summary.outputs.passed }}
      failed: ${{ steps.summary.outputs.failed }}
      skipped: ${{ steps.summary.outputs.skipped }}
      flaky: ${{ steps.summary.outputs.flaky }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    # Browser binaries are the slow part of "install --with-deps" — cache them by
    # lockfile hash so a run only re-downloads when the Playwright version actually
    # changes. OS-level deps (apt packages) aren't cacheable this way, so on a cache
    # hit we still run install-deps for those, which is fast on the stock ubuntu-latest image.
    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
    - name: Install Playwright Browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps
    - name: Install Playwright OS dependencies
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps
    - name: Run Playwright tests
      env:
        SCOPE_LABEL: ${{ needs.scope.outputs.label }}
      run: |
        if [ "$SCOPE_LABEL" = "full" ] || [ "$SCOPE_LABEL" = "division" ]; then
          npx playwright test --grep "@division"
        else
          npx playwright test --grep "@$SCOPE_LABEL"
        fi
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: allure-results-division
        path: allure-results/
        retention-days: 30
    - name: Extract test summary
      id: summary
      if: always()
      run: |
        if [ -f test-results/results.json ]; then
          PASSED=$(jq '.stats.expected' test-results/results.json)
          FAILED=$(jq '.stats.unexpected' test-results/results.json)
          SKIPPED=$(jq '.stats.skipped' test-results/results.json)
          FLAKY=$(jq '.stats.flaky' test-results/results.json)
        else
          PASSED=0; FAILED=0; SKIPPED=0; FLAKY=0
        fi
        {
          echo "passed=$PASSED"
          echo "failed=$FAILED"
          echo "skipped=$SKIPPED"
          echo "flaky=$FLAKY"
        } >> "$GITHUB_OUTPUT"

  nafith-login:
    needs: scope
    if: ${{ needs.scope.outputs.label == 'full' || needs.scope.outputs.label == 'nafith-login' }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.summary.outputs.passed }}
      failed: ${{ steps.summary.outputs.failed }}
      skipped: ${{ steps.summary.outputs.skipped }}
      flaky: ${{ steps.summary.outputs.flaky }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    # Browser binaries are the slow part of "install --with-deps" — cache them by
    # lockfile hash so a run only re-downloads when the Playwright version actually
    # changes. OS-level deps (apt packages) aren't cacheable this way, so on a cache
    # hit we still run install-deps for those, which is fast on the stock ubuntu-latest image.
    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
    - name: Install Playwright Browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps
    - name: Install Playwright OS dependencies
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps
    - name: Run Playwright tests
      run: npx playwright test --grep "@nafith-login"
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: allure-results-nafith-login
        path: allure-results/
        retention-days: 30
    - name: Extract test summary
      id: summary
      if: always()
      run: |
        if [ -f test-results/results.json ]; then
          PASSED=$(jq '.stats.expected' test-results/results.json)
          FAILED=$(jq '.stats.unexpected' test-results/results.json)
          SKIPPED=$(jq '.stats.skipped' test-results/results.json)
          FLAKY=$(jq '.stats.flaky' test-results/results.json)
        else
          PASSED=0; FAILED=0; SKIPPED=0; FLAKY=0
        fi
        {
          echo "passed=$PASSED"
          echo "failed=$FAILED"
          echo "skipped=$SKIPPED"
          echo "flaky=$FLAKY"
        } >> "$GITHUB_OUTPUT"

  # Merges the results from all three domain jobs into a single Allure report (one history,
  # one set of trend graphs) instead of three independent per-domain reports.
  publish-report:
    needs: [crm, division, nafith-login]
    # Runs even if a domain job didn't execute for this trigger's scope (skipped, not failed).
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Serializes gh-pages publishes: this job reads the current gh-pages content, merges in new
    # results, then overwrites the whole branch — two overlapping runs can race and the second to
    # start (not finish) clobbers the first's update with stale data it read before the first push.
    concurrency:
      group: publish-report-gh-pages
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@v4
    - name: Download allure results
      uses: actions/download-artifact@v4
      with:
        pattern: allure-results-*
        path: allure-results-all
        merge-multiple: true
    - name: Load report history
      uses: actions/checkout@v4
      if: always()
      continue-on-error: true
      with:
        ref: gh-pages
        path: gh-pages
    - name: Build combined report
      uses: simple-elf/allure-report-action@v1.15
      with:
        allure_results: allure-results-all
        allure_history: allure-history
        allure_report: allure-report
        gh_pages: gh-pages
    - name: Fix report ownership
      # The allure-report-action runs as root in a Docker container, so allure-history/ ends up
      # root-owned on the runner's filesystem — reclaim it before the runner user writes to it.
      if: always()
      run: |
        mkdir -p allure-history
        sudo chown -R "$(id -u):$(id -g)" allure-history
    - name: Publish report to GitHub Pages
      if: always()
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: allure-history

  # Slack ping for the unattended daily run, plus manual workflow_dispatch runs so the
  # notification path can be tested on demand — push/PR runs still skip it since those
  # already surface results in the Actions UI or PR checks in front of whoever triggered them.
  notify-slack:
    needs: [crm, division, nafith-login, publish-report]
    if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
    - name: Send Slack notification
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        CRM_RESULT: ${{ needs.crm.result }}
        DIVISION_RESULT: ${{ needs.division.result }}
        NAFITH_RESULT: ${{ needs.nafith-login.result }}
        CRM_PASSED: ${{ needs.crm.outputs.passed }}
        CRM_FAILED: ${{ needs.crm.outputs.failed }}
        CRM_SKIPPED: ${{ needs.crm.outputs.skipped }}
        CRM_FLAKY: ${{ needs.crm.outputs.flaky }}
        DIVISION_PASSED: ${{ needs.division.outputs.passed }}
        DIVISION_FAILED: ${{ needs.division.outputs.failed }}
        DIVISION_SKIPPED: ${{ needs.division.outputs.skipped }}
        DIVISION_FLAKY: ${{ needs.division.outputs.flaky }}
        NAFITH_PASSED: ${{ needs.nafith-login.outputs.passed }}
        NAFITH_FAILED: ${{ needs.nafith-login.outputs.failed }}
        NAFITH_SKIPPED: ${{ needs.nafith-login.outputs.skipped }}
        NAFITH_FLAKY: ${{ needs.nafith-login.outputs.flaky }}
        RUN_ID: ${{ github.run_id }}
        REPORT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        PASSED=$(( ${CRM_PASSED:-0} + ${DIVISION_PASSED:-0} + ${NAFITH_PASSED:-0} ))
        FAILED=$(( ${CRM_FAILED:-0} + ${DIVISION_FAILED:-0} + ${NAFITH_FAILED:-0} ))
        SKIPPED=$(( ${CRM_SKIPPED:-0} + ${DIVISION_SKIPPED:-0} + ${NAFITH_SKIPPED:-0} ))
        FLAKY=$(( ${CRM_FLAKY:-0} + ${DIVISION_FLAKY:-0} + ${NAFITH_FLAKY:-0} ))
        RUN_AT=$(date -u '+%Y-%m-%d %H:%M UTC')

        STATUS="success"
        for r in "$CRM_RESULT" "$DIVISION_RESULT" "$NAFITH_RESULT"; do
          if [ "$r" = "failure" ]; then STATUS="failure"; fi
        done
        EMOJI="✅"
        [ "$STATUS" = "failure" ] && EMOJI="❌"

        TEXT="${EMOJI} Tarekat E2E run #${RUN_ID} — ${RUN_AT}
        Passed: ${PASSED} | Failed: ${FAILED} | Skipped: ${SKIPPED} | Flaky: ${FLAKY}
        crm: ${CRM_RESULT}, division: ${DIVISION_RESULT}, nafith-login: ${NAFITH_RESULT}
        <${REPORT_URL}|View Allure report> | <${RUN_URL}|View run>"

        curl -sf -X POST -H 'Content-type: application/json' \
          --data "$(jq -n --arg text "$TEXT" '{text: $text}')" \
          "$SLACK_WEBHOOK_URL"
