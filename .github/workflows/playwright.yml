name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  # Fired by other repos' pipelines (e.g. BE/FE) when their change touches an area we cover here,
  # so we catch regressions before they merge. client_payload.label maps to a @tag on the relevant
  # suite (@cash-division, @investment-division, @division, @inheritance-request, ...) — see
  # tests/ for the full set. No label runs the full suite.
  repository_dispatch:
    types: [run-tests]
  # Manual trigger from the Actions tab — "Use workflow from" gives the branch picker for free;
  # this input adds a suite picker alongside it.
  workflow_dispatch:
    inputs:
      label:
        description: 'Test suite to run'
        required: true
        type: choice
        default: full
        options:
          - full
          - crm
          - division
          - online-services
jobs:
  # Resolves which suite(s) to run from either trigger, once, so the three suite jobs below don't
  # each repeat the same parsing/validation of an untrusted external payload.
  scope:
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.resolve.outputs.label }}
    steps:
    - id: resolve
      env:
        RAW_LABEL: ${{ github.event.client_payload.label || inputs.label }}
      run: |
        LABEL="${RAW_LABEL:-full}"
        if [[ ! "$LABEL" =~ ^[a-z0-9-]+$ ]]; then
          echo "::error::Invalid label '$LABEL' — must match ^[a-z0-9-]+$"
          exit 1
        fi
        echo "label=$LABEL" >> "$GITHUB_OUTPUT"

  # Named per domain (crm / division / online-services) so each shows as its own check in the
  # PR/Actions UI and runs in parallel — they only share the `scope` dependency, not each other.
  crm:
    needs: scope
    if: ${{ needs.scope.outputs.label == 'full' || needs.scope.outputs.label == 'crm' }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test --grep "@crm"
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report-crm
        path: playwright-report/
        retention-days: 30

  division:
    needs: scope
    if: >-
      ${{ needs.scope.outputs.label == 'full' || needs.scope.outputs.label == 'division' ||
      needs.scope.outputs.label == 'cash-division' || needs.scope.outputs.label == 'investment-division' }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      env:
        SCOPE_LABEL: ${{ needs.scope.outputs.label }}
      run: |
        if [ "$SCOPE_LABEL" = "full" ] || [ "$SCOPE_LABEL" = "division" ]; then
          npx playwright test --grep "@division"
        else
          npx playwright test --grep "@$SCOPE_LABEL"
        fi
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report-division
        path: playwright-report/
        retention-days: 30

  online-services:
    needs: scope
    if: >-
      ${{ needs.scope.outputs.label == 'full' || needs.scope.outputs.label == 'online-services' ||
      needs.scope.outputs.label == 'inheritance-request' }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test --grep "@inheritance-request"
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report-online-services
        path: playwright-report/
        retention-days: 30
